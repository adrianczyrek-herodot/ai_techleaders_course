<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shooting star demo</title>
  <link rel="stylesheet" href="./shooting-star.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      position: relative;
      background-color: #0b0d12;
      background-image: radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
                        radial-gradient(1px 1px at 70% 60%, #fff6, transparent);
      color: #e6e6e6;
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
    }
    .card {
      position: relative;
      z-index: 1;
      width: min(640px, 90vw);
      padding: 24px;
      border-radius: 12px;
      background: #161a22;
    }
    textarea { width: 100%; min-height: 80px; box-sizing: border-box; }
  </style>
</head>
<body>
  <main class="card">
    <h1>What should the agent work on?</h1>
    <textarea placeholder="Describe a task for the agent…"></textarea>
    <button type="button" id="unmount">Leave screen (unmount)</button>
  </main>
  <script type="module">
    import { mountShootingStar } from './shooting-star.js';
    const unmount = mountShootingStar(document.body);
    document.getElementById('unmount').addEventListener('click', unmount, { once: true });
  </script>
</body>
</html>
